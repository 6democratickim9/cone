services:
  api:
    build:
      context: ./backend
    environment:
      ADDR: :8080
      DATA_FILE: /data/calculations.json
    ports:
      - "8080:8080"
    volumes:
      - cone_api_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  cone_api_data:
